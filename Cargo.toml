[package]
name = "mender-connect-rust"
version = "0.1.0-rc.1"
edition = "2024"
license = "Apache-2.0"
description = "Experimental Linux-only Rust rewrite of mender-connect"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
nix = { version = "0.29", features = ["user", "fs", "signal", "process", "socket", "poll"] }
nix_spawn = { version = "0.31.3", package = "nix", features = ["process", "signal", "fs", "term"] }
portable-pty = "0.9.0"
rand = "0.10"
rmp = "0.8"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
rustix = { version = "1.1.6", features = ["process", "fs", "thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "net", "sync", "signal", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
url = "2"
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy", "service"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["test-util"] }
