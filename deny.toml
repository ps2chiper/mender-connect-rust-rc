# Permanent dependency policy for mender-connect-rust 0.1.0-rc.1.
# Scope: x86_64-unknown-linux-gnu only (the qualified target).
#
# This policy accepts only permissive licenses present in the frozen Linux
# dependency graph. The one LGPL alternative (r-efi) is not selected: the
# MIT/Apache-2.0 alternatives are accepted. The project license is the
# upstream Apache-2.0 original; see LICENSE-POLICY.md.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
]

[licenses.private]
ignore = false

[bans]
# Duplicate versions are visible as warnings and are documented in
# THIRD_PARTY_LICENSES.md. They are not silently skipped.
multiple-versions = "warn"
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []